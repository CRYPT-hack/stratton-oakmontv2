# Template for the Secret the deployments read from. Copy it, fill in real
# values, and apply the copy -- which is gitignored, so it cannot be committed.
#
#   cp secrets.example.yaml secrets.yaml
#   $EDITOR secrets.yaml
#   kubectl apply -f secrets.yaml
#
# Or create the Secret directly, without a file on disk at all:
#
#   kubectl create secret generic portai-secrets #     --from-literal=postgres-password=... #     --from-literal=database-url=postgresql://portai_user:...@portai-postgres:5432/portai_db #     --from-literal=openai-api-key=...
#
# The password inside database-url must match postgres-password.
apiVersion: v1
kind: Secret
metadata:
  name: portai-secrets
type: Opaque
stringData:
  postgres-password: "CHANGE_ME"
  database-url: "postgresql://portai_user:CHANGE_ME@portai-postgres:5432/portai_db"
  openai-api-key: "CHANGE_ME"
